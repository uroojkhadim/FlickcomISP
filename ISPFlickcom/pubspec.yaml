name: source_plain_internet
description: "ISP Service Management Platform - Customer App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # HTTP Client
  dio: ^5.8.0+1

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Typography
  google_fonts: ^6.2.1

  # UI Enhancements
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0
  image_picker: ^1.1.2

  # Date & Number Formatting
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.2

  # Diagnostics
  flutter_internet_speed_test: ^1.5.0
  form_builder_validators: ^11.3.0
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/icons/

  # Fonts (Inter from Google Fonts package, no need for local assets)

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
